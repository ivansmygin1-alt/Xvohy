<title>XVOHY Games Pro</title>

<style>
:root{
  --bg:#090a10;--bg2:#0d0f17;--card:#12141d;--card2:#181b26;
  --gold:#ffd65a;--gold2:#dca62d;--text:#f2f3f7;--muted:#9da3b3;
  --line:#2a2e3d;--red:#ff4b5c;--green:#32d583;--blue:#62a7ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100%;overflow-x:hidden}
body{padding-bottom:92px}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:720px;margin:auto;padding:14px 14px 24px}
.top{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 18px}
.brand small{display:block;color:var(--muted);letter-spacing:4px;font-size:10px;margin-bottom:4px}
.logo{font-weight:900;font-size:31px;letter-spacing:1px}.logo span{color:var(--gold)}
.userbox{display:flex;gap:9px;align-items:center;background:var(--card);border:1px solid var(--line);padding:8px 11px;border-radius:16px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#17130a;font-weight:900}
.username{font-size:13px;font-weight:700}.usertag{font-size:11px;color:var(--muted);margin-top:3px}
.balance{background:linear-gradient(110deg,rgba(255,214,90,.13),rgba(255,255,255,.02));border:1px solid #39384a;border-radius:28px;padding:24px 22px;display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
.balance-label{color:var(--muted);font-size:13px;letter-spacing:.6px}.money{font-size:40px;font-weight:900;margin:8px 0}
.balance-sub{color:var(--muted);font-size:14px}
.reset{width:56px;height:56px;border:0;border-radius:18px;background:#171a27;color:var(--gold);font-size:24px;display:grid;place-items:center}
.page{display:none}.page.active{display:block}
.welcome h2{font-size:32px;margin:0 0 9px}.welcome p{color:var(--muted);font-size:16px;margin:0 0 24px;line-height:1.45}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.game-card{background:linear-gradient(145deg,var(--card),#0e1018);border:1px solid var(--line);border-radius:30px;padding:24px 18px;min-height:310px;transition:.18s;display:flex;flex-direction:column;align-items:center;text-align:center}
.game-card:active{transform:scale(.98)}
.game-icon-box{height:160px;width:100%;border:1px solid #282d3c;border-radius:24px;display:grid;place-items:center;background:radial-gradient(circle,rgba(255,214,90,.08),transparent 70%);margin-bottom:14px;overflow:hidden}
.game-card h3{font-size:22px;margin:8px 0 6px}.game-card p{color:var(--muted);font-size:14px;line-height:1.4;margin:0}
.promo-box,.panel,.profile-card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:20px;margin-top:22px}
.promo-box h3,.panel h3{margin:0 0 16px;font-size:23px}
.input-row{display:flex;gap:10px}.input-row input,.field input,.field select{width:100%;background:#0d1018;border:1px solid #303548;border-radius:15px;color:white;padding:15px;outline:none}
.gold-btn,.action-btn{border:0;border-radius:15px;padding:15px 18px;font-weight:900;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#17130a}
.secondary{background:#1a1e2b;color:var(--text);border:1px solid #303548}
.danger{background:rgba(255,75,92,.15);color:var(--red);border:1px solid rgba(255,75,92,.3)}
.game-page{display:none}.game-page.active{display:block}
.back{border:1px solid var(--line);background:var(--card);color:var(--text);padding:11px 16px;border-radius:14px;margin-bottom:18px}
.game-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.game-title h2{margin:0;font-size:28px}.badge{font-size:11px;color:#17130a;background:var(--gold);border-radius:999px;padding:6px 9px;font-weight:900}
